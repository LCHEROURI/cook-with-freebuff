# ── Dietary profile, deploy status, tool logs, markers ───────────────────────

query GetDietaryProfile($userId: String!) @auth(level: NO_ACCESS) {
  dietaryProfile(first: { where: { userId: { eq: $userId } } }) {
    userId
    allergies
    dietaryRestrictions
    dislikedIngredients
    preferredCuisines
    defaultServings
    preferredEquipment
    updatedAt
  }
}

query GetDeployStatus($slot: String!) @auth(level: NO_ACCESS) {
  deployStatus(first: { where: { slot: { eq: $slot } } }) {
    slot
    verdict
    commitSha
    reason
    source
    recordedAt
    active
    recurringCount
    signature
    weeks
    runUrl
  }
}

query GetAgentToolLog($id: String!) @auth(level: NO_ACCESS) {
  agentToolLog(id: $id) {
    id
    userId
    sessionId
    tool
    sanitizedArguments
    result
    latencyMs
    at
    correlationId
  }
}

query GetCorrelationMarker($key: String!) @auth(level: NO_ACCESS) {
  correlationMarker(first: { where: { key: { eq: $key } } }) {
    key
    rawId
    legacyRawId
    markedAt
  }
}