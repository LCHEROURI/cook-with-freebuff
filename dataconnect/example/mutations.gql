# Idempotency markers join the session transaction via response binding so the
# transition and marker commit together (PR #58 invariant).
mutation UpsertCorrelationMarker(
  $key: String!
  $rawId: String!
  $legacyRawId: String
  $markedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  correlationMarker_upsert(
    data: {
      key: $key
      rawId: $rawId
      legacyRawId: $legacyRawId
      markedAt: $markedAt
    }
  )
}

mutation DeleteCorrelationMarker($key: String!) @auth(level: NO_ACCESS) {
  correlationMarker_delete(first: { where: { key: { eq: $key } } })
}