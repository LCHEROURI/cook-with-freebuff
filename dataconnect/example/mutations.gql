# cook-with-freebuff — SQL Connect mutations
#
# Every mutation runs with @auth(level: NO_ACCESS) — the Node Admin SDK is the
# only caller, and the app's owner-token + App Check authorization stays at
# the API layer (see docs/specs/0005-sql-connect-migration-scope.md).
#
# Concurrency and atomicity:
#   • UpdateSession is a @transaction with a filtered update on `version` and
#     a @check conflict guard — the SQL Connect expression of the Firestore
#     optimistic-concurrency update in lib/server/repositories.ts
#     (updateSession). The version-conflict surfaces through the @check
#     message, which the repository maps back to the existing
#     "Session ${id} version conflict" error the session service expects.
#   • RebaseTimers is a @transaction that shifts every RUNNING timer's endsAt
#     by the same offset — the SQL Connect version of the Firestore batch
#     rebase on resume. A filtered update is an atomic rewrite of the row, so
#     a single expression handles the whole rebase.

# ── Recipes ──────────────────────────────────────────────────────────────────

mutation InsertRecipe(
  $id: String!
  $userId: String
  $title: String!
  $description: String
  $servings: Int!
  $estimatedPrepMinutes: Int!
  $estimatedCookMinutes: Int!
  $totalMinutes: Int!
  $ingredients: Any!
  $prepSteps: Any!
  $cookingSteps: Any!
  $equipment: [String!]!
  $dietaryTags: [String!]!
  $allergens: [String!]!
  $safetyNotes: [String!]!
  $proteinCategories: [String!]
  $preferences: Any
  $generatedAt: Timestamp!
  $updatedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  recipe_insert(
    data: {
      id: $id
      userId: $userId
      title: $title
      description: $description
      servings: $servings
      estimatedPrepMinutes: $estimatedPrepMinutes
      estimatedCookMinutes: $estimatedCookMinutes
      totalMinutes: $totalMinutes
      ingredients: $ingredients
      prepSteps: $prepSteps
      cookingSteps: $cookingSteps
      equipment: $equipment
      dietaryTags: $dietaryTags
      allergens: $allergens
      safetyNotes: $safetyNotes
      proteinCategories: $proteinCategories
      preferences: $preferences
      generatedAt: $generatedAt
      updatedAt: $updatedAt
    }
  )
}

mutation SaveRecipe(
  $id: String!
  $userId: String
  $title: String!
  $description: String
  $servings: Int!
  $estimatedPrepMinutes: Int!
  $estimatedCookMinutes: Int!
  $totalMinutes: Int!
  $ingredients: Any!
