}

mutation DeleteCookingSession($id: String!) @auth(level: NO_ACCESS) {
  cookingSession_delete(id: $id)
}

# Optimistic-concurrency update: only applies when the stored version equals
# the caller's expected version, and bumps it. When the version has moved, the
# filtered update matches no row, the @check fails, and the mutation aborts
# with the conflict message — the SQL Connect form of the Firestore
# transaction + version guard in repositories.ts updateSession.
mutation UpdateSession(
  $id: String!
  $expectedVersion: Int!
  $status: SessionStatus
  $currentPhase: SessionPhase
  $currentPrepStepIndex: Int
  $currentCookingStepIndex: Int
  $previousState: Any
  $resumableState: Any
  $activeTimerIds: [String!]
  $availableIngredients: Any
  $recoveryContext: Any
  $pendingSubstitution: String
  $pendingPantryItems: Any
  $lastActivityAt: Timestamp
  $pausedAt: Timestamp
  $completedAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  session_ver: cookingSession_update(
    first: {
      where: {
        _and: [
          { id: { eq: $id } },
          { version: { eq: $expectedVersion } }
        ]
      }
    },
    data: {
      version_update: { inc: 1 }
      status: $status
      currentPhase: $currentPhase
      currentPrepStepIndex: $currentPrepStepIndex
      currentCookingStepIndex: $currentCookingStepIndex
      previousState: $previousState
      resumableState: $resumableState
      activeTimerIds: $activeTimerIds
      availableIngredients: $availableIngredients
      recoveryContext: $recoveryContext
      pendingSubstitution: $pendingSubstitution
      pendingPantryItems: $pendingPantryItems
      lastActivityAt: $lastActivityAt
      pausedAt: $pausedAt
      completedAt: $completedAt
    }
  ) @check(expr: "this != null", message: "Session version conflict or missing")
}

