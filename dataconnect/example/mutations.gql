mutation UpdateCookingTimer(
  $id: String!
  $status: TimerStatus
  $endedAt: Timestamp
  $endsAt: Timestamp
) @auth(level: NO_ACCESS) {
  cookingTimer_update(
    id: $id,
    data: {
      status: $status
      completedAt: $endedAt
      endsAt: $endsAt
    }
  )
}

# Shift every RUNNING timer for a session by the same offset (elapsedMs) —
# the SQL Connect expression of the Firestore rebase-on-resume batch. A
# filtered update rewrites each matched row atomically in one transaction.
mutation RebaseTimers(
  $sessionId: String!
  $endsAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  cookingTimer_updateMany(
    where: {
      _and: [
        { sessionId: { eq: $sessionId } },
        { status: { eq: RUNNING } }
      ]
    },
    data: {
      endsAt: $endsAt
    }
  )
}

