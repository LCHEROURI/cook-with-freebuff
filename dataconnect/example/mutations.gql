# ── Dietary profile, deploy status, tool logs, markers ───────────────────────

mutation UpsertDietaryProfile(
  $userId: String!
  $allergies: [String!]!
  $dietaryRestrictions: [String!]!
  $dislikedIngredients: [String!]!
  $preferredCuisines: [String!]!
  $defaultServings: Int
  $preferredEquipment: [String!]!
  $updatedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  dietaryProfile_upsert(
    data: {
      userId: $userId
      allergies: $allergies
      dietaryRestrictions: $dietaryRestrictions
      dislikedIngredients: $dislikedIngredients
      preferredCuisines: $preferredCuisines
      defaultServings: $defaultServings
      preferredEquipment: $preferredEquipment
      updatedAt: $updatedAt
    }
  )
}

# Single-slot upsert: newest write wins per slot, mirroring the Firestore
# deploy_status doc semantics behind /status.
mutation UpsertDeployStatus(
  $slot: String!
  $verdict: String
  $commitSha: String
  $reason: String
  $source: String
  $recordedAt: Timestamp!
  $active: Boolean
  $recurringCount: Int
  $signature: String
  $runUrl: String
) @auth(level: NO_ACCESS) {
  deployStatus_upsert(
    data: {
      slot: $slot
      verdict: $verdict
      commitSha: $commitSha
      reason: $reason
      source: $source
      recordedAt: $recordedAt
      active: $active
      recurringCount: $recurringCount
      signature: $signature
      runUrl: $runUrl
    }
  )
}

mutation InsertAgentToolLog(
  $id: String!
  $userId: String!
  $sessionId: String
  $tool: String!
  $sanitizedArguments: Any!
