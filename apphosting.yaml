# ── Cloud Run service config ──────────────────────────────────────────────
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# ── Environment variables ─────────────────────────────────────────────────
env:
  # Firebase client config (safe to expose, available at build + runtime)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA9iUv7FVUDEuwO5pdEd8RXJc9qshNMRlE
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: portfolio-app-freebuff2.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: portfolio-app-freebuff2
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: portfolio-app-freebuff2.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "952213217375"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:952213217375:web:ad84f1308f28ca4f523bea
    availability:
      - BUILD
      - RUNTIME

  # Firebase App Check (site key is public in the browser bundle, but managed
  # through Secret Manager so each environment can provision its own value)
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    secret: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: APP_CHECK_ENFORCED
    value: "1"
    availability:
      - RUNTIME

  # Feature toggles
  - variable: NEXT_PUBLIC_ENABLE_AI_BRIEFINGS
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_LIVE_DEPLOYMENTS
    value: "1"
    availability:
      - BUILD
      - RUNTIME

  # Google AI (Gemini) — secret reference
  - variable: GOOGLE_AI_API_KEY
    secret: GOOGLE_AI_API_KEY

  # Firebase Admin service account — secret reference
  - variable: FIREBASE_SERVICE_ACCOUNT
    secret: FIREBASE_SERVICE_ACCOUNT
