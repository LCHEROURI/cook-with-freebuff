name: Mic regression (weekly phase-C pass rate)

# Scheduled weekly monitor for the two-burst mic path that was dropping the
# second burst (proven live at 33% pass rate before the drain-stuck fix).
# Cumulative CI bound since the fix: 166 clean two-burst verdicts (89 batch
# runs + 77 post-deploy voice stages), 0 drops — P(0 drops | 33% rate) ≈
# 10⁻²⁹. Runs the phase-C-only batch against the LIVE deploy and fails the job
# if ANY run drops a burst — so a regression that the one-time verification
# missed shows up as a red check within a week instead of surfacing on a
# user's phone. The driver cleans up its probe recipe and owner session on
# every exit path, so a red run never leaves debris.
#
# Event notes:
#   - `schedule` runs on the default branch only (no fork PRs), but keep the
#     same fork discipline as the other workflows: the run step is gated on
#     the owner credentials (skip-not-fail) and the loud guard is
#     canonical-repo-only, so a missing credential never masquerades as a
#     green weekly pass.
#   - Batch size 6: matches the measured verification batches. At the pre-fix
#     33% drop rate, P(≥1 drop in 6) ≈ 91%, so a regression to the old failure
#     mode reddens the FIRST week; the run budget stays under 20 minutes
#     (each run ~90s + Chrome + npm ci). Cumulative CI bound since the fix
#     (166 clean checks, 0 drops): P ≈ 10⁻²⁹.
#   - Flake budget (kind-aware): the session-launch API 503'd on a real batch
#     (5/6) — a transient infra failure must NOT open a false-positive issue.
#     Pre-mic / infra run failures are forgiven up to MIC_REGRESSION_FLAKE_BUDGET
#     (workflow_dispatch input `flake_budget`, default 1); the monitored
#     contract — two-burst drop, stuck queue, latency-bound violation, or an
#     uncapturable diagnostics blob — is NEVER budgeted, so a true regression
#     cannot hide behind the budget and still reddens the first week.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      # Transient (pre-mic / infra) run failures forgiven before the batch
      # reddens. Hard two-burst failures are never budgeted, so raising this
      # cannot mask a regression — it only widens tolerance for infra flakes.
      flake_budget:
        description: 'Transient (pre-mic / infra) run failures forgiven before the batch reddens — hard two-burst failures are never budgeted.'
        required: false
        default: '1'
      # Drill seam: every run injects the documented stuck-queue signature into
      # its judged blob, so the red-week evidence chain (verdict → fail → blob
      # + screenshot artifacts → red batch) can be proven end-to-end. Never set
      # on scheduled runs; the scheduled default is false (no injection).
      force_stuck_blob:
        description: 'Drill: inject the stuck-queue signature into every run so the red-week evidence path fires — for artifact-upload drills only.'
        required: false
        default: 'false'

# Shared with the post-deploy verify:live job (ci.yml): both drive the SAME
# owner through the same /cook active session, so a Monday run overlapping a
# deploy must QUEUE behind it (or ahead of it) instead of both attaching to
# whichever probe is newest (Codex P2, PR #98 review).
concurrency:
  group: live-voice-probe
  cancel-in-progress: false

jobs:
  phase-c-batch:
    name: Phase-C two-burst batch (6 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Minimal token scope: checkout needs contents:read; the alert step
    # (below) opens a GitHub issue on a red week, which needs issues:write.
    permissions:
      contents: read
      issues: write

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
      # The driver defaults to the canonical URL; pin it explicitly so a
      # future move of the default can never silently re-target the monitor.
      VERIFY_BASE_URL: https://cook-with-freebuff--portfolio-app-freebuff2.us-central1.hosted.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The driver drives the real /cook UI via CDP (headless), so the runner
      # needs a Chromium binary — same browser-actions/setup-chrome pattern as
      # verify-deployed.yml; its macOS path fallback would crash on Linux.
      - name: Install Chrome for the CDP driver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      # The driver mints a REAL owner session (SA-signed custom token) and
      # writes to the shared backend (seed + probe + cleanup), so it needs the
      # same owner credentials verify:live uses. On the canonical repo a
      # missing credential must fail loudly — a silent skip would look like a
      # green weekly pass.
      - name: Fail loudly if owner credentials are missing
        if: ${{ github.repository == 'LCHEROURI/cook-with-freebuff' && (env.NEXT_PUBLIC_FIREBASE_API_KEY == '' || env.FIREBASE_SERVICE_ACCOUNT == '' || env.APP_OWNER_UID == '') }}
        run: |
          echo "::error::Owner-credential secrets missing — the weekly phase-C monitor cannot mint its owner session."
          echo "Add NEXT_PUBLIC_FIREBASE_API_KEY, FIREBASE_SERVICE_ACCOUNT and APP_OWNER_UID under GitHub -> Settings -> Secrets and variables -> Actions, then re-run."
          exit 1

      # Gated on the credentials so forks / unconfigured repos stay green; on
      # the canonical repo the loud guard above turns a missing credential
      # into a hard failure instead.
      - name: Run the phase-C batch (6 runs)
        id: batch
        if: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.APP_OWNER_UID != '' }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # Configurable flake budget (workflow_dispatch input; empty on
          # schedule runs, so the `||` default applies there).
          MIC_REGRESSION_FLAKE_BUDGET: ${{ inputs.flake_budget || '1' }}
          # Drill seam (workflow_dispatch input; empty on schedule runs → the
          # driver reads only `1` as armed, so scheduled runs never inject).
          PHASE_C_FORCE_STUCK: ${{ inputs.force_stuck_blob == 'true' && '1' || '' }}
        run: |
          set -uo pipefail
          passes=0
          hard_failed=""
          flake_failed=""
          for i in 1 2 3 4 5 6; do
            echo "--- run $i/6 ---"
            # Capture each run's log so a failure can be classified: the
            # monitored contract (drop / stuck queue / latency) is NEVER
            # budgeted; only pre-mic / infra failures count as flakes.
            log="${RUNNER_TEMP}/phase-c/run-$i/driver.log"
            # The driver creates its own --out dir at startup, but tee opens
            # the log BEFORE the driver runs — create the dir first or tee's
            # open fails and the log is never written (a hard failure would
            # then grep-empty and be misclassified as a flake — proven by the
            # force-stuck drill, which reddened via the flake path).
            mkdir -p "${RUNNER_TEMP}/phase-c/run-$i"
            if node scripts/drive-live-voice.mjs --phase-c-only --probe-prefix mic-regression- --out "${RUNNER_TEMP}/phase-c/run-$i" 2>&1 | tee "$log"; then
              passes=$((passes + 1))
            elif grep -qE 'reports a stuck queue|transcription\(s\) after 90s|latency bounds exceeded|latency cannot be bounded|second reply never drained|diagnostics blob was not capturable' "$log"; then
              hard_failed="$hard_failed $i"
            else
              flake_failed="$flake_failed $i"
            fi
          done
          flake_budget="${MIC_REGRESSION_FLAKE_BUDGET:-1}"
          case "$flake_budget" in
            ''|*[!0-9]*) echo "::warning::MIC_REGRESSION_FLAKE_BUDGET='$flake_budget' is not a number — defaulting to 1"; flake_budget=1;;
          esac
          flake_count=0
          for n in $flake_failed; do flake_count=$((flake_count + 1)); done
          # A hard (never-budgeted) failure reddens the week unconditionally.
          if [ -n "$hard_failed" ]; then
            echo "::error::phase-C batch: ${passes}/6 passed — hard failure(s):${hard_failed} (never budgeted) — blobs + screenshots saved under ${RUNNER_TEMP}/phase-c"
            echo "result=${passes}/6 passed — hard failure(s):${hard_failed}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Transient flakes are forgiven only up to the configured budget.
          if [ "$flake_count" -gt "$flake_budget" ]; then
            echo "::error::phase-C batch: ${passes}/6 passed — ${flake_count} flake(s):${flake_failed} exceed the flake budget ${flake_budget} — blobs + screenshots saved under ${RUNNER_TEMP}/phase-c"
            echo "result=${passes}/6 passed — ${flake_count} flake(s):${flake_failed} exceed budget ${flake_budget}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # A forgiven week is a NOTICE (no `result` output → the issue step
          # stays silent) — the flake is visible in the log, not an alert.
          if [ "$flake_count" -gt 0 ]; then
            echo "::notice::phase-C batch: ${passes}/6 passed — ${flake_count} flake(s)${flake_failed} within budget ${flake_budget} (forgiven — no issue)"
          else
            echo "::notice::phase-C batch: 6/6 passed — no two-burst regression"
          fi

      # Always upload the run artifacts (including a failed run's
      # copy-voice-details blob + screenshot) so a red week is debuggable from
      # the workflow run alone, without asking the driver's owner to re-paste.
      - name: Upload phase-C artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-runs
          path: ${{ runner.temp }}/phase-c
          if-no-files-found: ignore

      # A red week must alert someone — open a GitHub issue with the pass
      # rate, the run link, and the artifact link (the failing run's blob +
      # screenshot). Dedupe: an already-open mic-regression issue means the
      # regression is known, so consecutive red weeks don't spam. Gated on the
      # batch step's `result` output (empty on green) and the canonical repo.
      - name: Open a GitHub issue on a red week
        # always(): the batch step exits 1 on a red week, and a status-less
        # condition would be implicitly wrapped in success() and never run —
        # the exact red-week scenario this alert exists for (Codex P1, PR #11).
        if: ${{ always() && steps.batch.outputs.result != '' && github.repository == 'LCHEROURI/cook-with-freebuff' }}
        # gh inside Actions is NOT authenticated by default — without GH_TOKEN
        # every gh call here dies with "set the GH_TOKEN environment variable"
        # and a red week never opens its issue (proven by the force-stuck
        # drill: the batch reddened but the alert step failed).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "mic-regression" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "an open mic-regression issue already exists — skipping (dedupe)"
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}"
          artifact_url="$run_url/artifacts"
          gh label create "mic-regression" --force 2>/dev/null || true
          gh issue create \
            --title "Mic regression: phase-C batch failed (${{ steps.batch.outputs.result }})" \
            --label "mic-regression" \
            --body "The weekly phase-C two-burst check went red on $(date -u +%Y-%m-%dT%H:%MZ).

          - **Result:** ${{ steps.batch.outputs.result }}
          - **Run:** $run_url
          - **Artifacts (phase-c-runs — the failing run's copy-voice-details blob + screenshot):** $artifact_url

          A healthy run shows stuckQueueSince=0 in the diagnostics blob. The blob's drop-classification verdict (queue / network / audio-graph) pinpoints which layer dropped the mic. A latency-bound failure (flush→transcript, transcript→reply, or inter-burst gap over budget) means the pipeline degraded but did not drop — the phase-c-latency blob + screenshot show the state at the violation. Investigate the artifact evidence before dismissing."
