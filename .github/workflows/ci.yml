name: CI

on:
  push:
    # The merge queue pushes its temporary branches (gh-readonly-queue/**) to
    # run the required checks against the MERGED state — the workflows must
    # trigger there or the queue waits forever on checks that never report.
    branches: [main, 'gh-readonly-queue/**']
  pull_request:
    branches: [main]
  # Manual re-run of the post-deploy verification without a new push.
  workflow_dispatch:
    inputs:
      force_verify_live_regression:
        description: |
          Drill seam: inject a synthetic real-verification failure AFTER
          the pre-stage guard so the resulting run has TWO failures — a
          spare (the guard) and a regression (this seam) — and the
          classifier is pinned to return reason=undefined for that shape.
          Proves sparing NEVER masks a genuine failure run next to it.
        required: false
        default: 'false'
      source:
        description: |
          Dispatch source tag recorded in deploy_status/verify_live so the
          status page can distinguish drill runs (spare-drill, boundary-drill,
          regression-drill) from clean ci.yml runs. Default 'ci' means a
          push-triggered or manual re-run without drill inputs.
        required: false
        default: 'ci'

# One run per branch at a time: a new push to the SAME branch cancels the
# in-progress run (cancel-in-progress). This is EXPECTED behavior, not a
# failure — e.g. pushing two commits back-to-back cancels the first commit's
# run mid-deploy, so its CI shows `cancelled` and its deploy never finishes
# (seen with the c2e3b2b push, superseded by fd7b379 before verify:live).
# The run to check is therefore ALWAYS the LATEST completed run on the
# branch (newest createdAt for that headSha / the final green run), never a
# cancelled one — the cancelled run's gates (emulator-compare, typecheck,
# deploy, verify:live) are re-run in full by the newer push's run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The identical command an engineer runs locally: typecheck → lint →
      # test → build in one invocation (npm run check). Local and CI run the
      # SAME gate, so a green local check means a green validate job — no
      # drift between what works on a laptop and what blocks a merge.
      - name: Local green gate (typecheck · lint · test · build)
        run: npm run check

      # The mic trend report is a MONITORED ARTIFACT: docs/mic-regression-
      # trend.md may only ever declare ZERO two-burst drops. The weekly
      # refresh (mic-trend-weekly.yml) regenerates it from Actions history;
      # this tokenless gate fails any commit that carries a report with
      # drops > 0 — a hand-edit that hides or adds drops, a parser drift in
      # the refresh CLI that stops counting them, or a committed red report
      # all red here, on every push.
      - name: Verify the mic trend report shows zero drops (artifact gate)
        run: node scripts/mic-trend-gate.mjs

      # Push-time stale-head guard: verifies the pushed HEAD is not a rollback
      # of what the App Hosting host is currently serving, BEFORE the deploy
      # starts (the post-deploy gate can only prove what was deployed == what
      # was pushed; it cannot catch a stale push that should never have
      # deployed). Runs verify-deployed-hash with --stale-guard, which is
      # DIRECTION-aware: a normal forward push (live behind the pushed HEAD —
      # the standard case right before a deploy) PASSES here and is proven
      # after deploy; only a push whose HEAD is NOT ahead of live
      # (rollback/diverged) fails. Tokenless: the live commit comes from the
      # host's public /api/build-info, so no secret gate is needed. Only runs
      # on pushes to main — a PR head is legitimately behind live main, so the
      # check would falsely block every PR.
      - name: Verify pushed head is not stale vs live (stale-guard)
        if: ${{ github.event_name == 'push' }}
        run: node scripts/verify-deployed-hash-gate.mjs --stale-guard

      # PR-time stale-head guard: the SAME direction-aware gate, pinned to the
      # PR head via --head instead of the pushed HEAD. This is load-bearing on
      # PRs because the checkout is the MERGE ref — which always contains
      # current base main — so comparing live against the checkout HEAD would
      # make every stale PR pass. The rule, applied to the PR head: FAIL iff
      # live is NOT an ancestor of the PR head (the PR was cut before live's
      # current state — stale, update the branch); PASS if the PR head already
      # contains the entire live state (cut from current-or-newer main). A PR
      # head is legitimately behind BASE main (that is why this step never
      # runs on push — the push-time step above is the push contract), but a
      # PR cut before LIVE's state is exactly what this check surfaces in the
      # PR checks instead of only at merge time. Tokenless like the push-time
      # step. Fork PRs are skipped: the gate fetches commits by sha from
      # origin, and a fork's origin does not carry the live commit on upstream
      # main, so the ancestry check cannot run there.
      - name: Verify PR head is not stale vs live (stale-guard)
        if: ${{ github.event_name == 'pull_request' && github.repository == 'LCHEROURI/cook-with-freebuff' }}
        run: node scripts/verify-deployed-hash-gate.mjs --stale-guard --head "${{ github.event.pull_request.head.sha }}"

  # Firebase App Hosting deploy — App Hosting is the PRIMARY production host.
  # Every main push deploys here, AFTER validate passes (never deploy broken
  # code). Auth is a FIREBASE_TOKEN refresh token from `firebase login:ci` run
  # as the project OWNER: `firebase deploy --only apphosting` is the "deploy
  # from source as a human" path and provisions resources (creates a service
  # account, sets the project IAM policy for the App Hosting agents) that
  # require owner-level IAM — the restricted Admin SDK service account the
  # verify gates use does NOT have it, and must never be widened to setIamPolicy.
  # write-commit.mjs stamps the CI HEAD into commit-sha.txt first (the source
  # ZIP excludes .git), so /api/build-info reports the exact pushed commit.
  # Gated on FIREBASE_TOKEN (skip-not-fail on forks/unconfigured repos); the
  # loud guard below turns a missing token on a canonical main push into a
  # failure. Pull requests never deploy.

  # Emulator-compare smoke: prove the deterministic guided flow works on the
  # local Firestore/Auth emulator stack AND matches what production serves,
  # BEFORE any deploy proceeds. Runs on every main push (and manual
  # dispatch); deploy-apphosting waits on it. The deployed leg uses the same
  # owner-credential secrets the verify:live job uses; the emulator leg is
  # offline and needs Java 21 (Firestore emulator). A divergence — a guided
  # step that passes on one stack and not the other — fails the job.
  #
  # Deliberately NOT a pull_request job or a GitHub required check: the
  # deployed leg WRITES to the shared production backend (seed + probe +
  # cleanup), and per-PR runs would burn the owner-verify write budget for a
  # context-independent check. It still gates the Firebase App Hosting deploy
  # (deploy-apphosting needs it) and runs red on every main push, so a
  # regression is visible on the commit — just not a merge blocker.
  emulator-compare:
    name: Emulator-compare smoke (guided flow vs live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator requires Java 21 (see README); ubuntu runners
      # default to an older JDK, so pin it explicitly.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Emulator-backed integration test: proves the rollback-resume marker
      # atomicity through the REAL repositories (no fakes) against a live
      # Firestore emulator. Boots and tears down its own emulator; the Java 21
      # setup above is exactly what it needs. Independent of owner secrets, so
      # it also runs on forks.
      - name: Run the emulator integration test (marker atomicity)
        run: npm run test:emulator

      - name: Fail loudly if owner credentials are missing
        if: ${{ github.repository == 'LCHEROURI/cook-with-freebuff' && (env.NEXT_PUBLIC_FIREBASE_API_KEY == '' || env.FIREBASE_SERVICE_ACCOUNT == '' || env.APP_OWNER_UID == '') }}
        run: |
          echo "::error::Owner-credential secrets missing — the emulator-compare smoke cannot run its deployed leg."
          echo "Add NEXT_PUBLIC_FIREBASE_API_KEY, FIREBASE_SERVICE_ACCOUNT and APP_OWNER_UID under GitHub -> Settings -> Secrets and variables -> Actions, then re-run."
          exit 1

      # Served-revision prerequisite for the write-capable deployed leg: the
      # compare's deployed leg WRITES to the shared production backend (seed +
      # probe + cleanup) and, with App Check enforcement on, now mints a token
      # and passes (PR #176). validate's stale-guard runs in a PARALLEL job
      # this job does not wait for, so re-run the same direction-aware tokenless
      # gate HERE, immediately before the write: it proves the live host serves
      # a revision the pushed HEAD descends from — never ahead of or diverged
      # from it — before the leg mutates or validates anything. Tokenless: the
      # live commit comes from the host's public /api/build-info, so no new
      # secret wiring. (Codex P1, PR #176 review.)
      - name: Verify the served revision before the write-capable compare leg
        if: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.APP_OWNER_UID != '' }}
        run: node scripts/verify-deployed-hash-gate.mjs --stale-guard

      # Credential-gated so a fork or unconfigured repo skips the deployed leg
      # instead of failing it (the deployed leg needs the owner secrets). On
      # the canonical repo the loud guard above already failed the job when the
      # secrets are missing, so this gate never weakens that guard (Codex P2,
      # PR #7 — the smoke was once unconditional and broke fork CI runs).
      - name: Run the emulator-compare smoke
        if: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.APP_OWNER_UID != '' }}
        run: npm run verify:live:compare:emulator

  deploy-apphosting:
    name: Deploy Firebase App Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, emulator-compare]
    # Real main pushes only — the merge queue ALSO pushes (gh-readonly-queue
    # branches), and deploying those merge commits to App Hosting would ship
    # unmerged work. workflow_dispatch stays operator-initiated.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

    # Whether a rollout actually started this run. When FIREBASE_TOKEN is
    # missing (fork, secretless dispatch) the deploy step is SKIPPED while the
    # job still succeeds — verify-live waits on this output so it skips too
    # instead of polling the canonical host for a sha that will never arrive
    # and failing after 15 minutes. Preserves the skip-not-fail behavior.
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}

    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      # The restricted Admin SDK SA authorizes the canonical host for Firebase
      # Auth (below). It is NOT the deploy credential — the deploy still runs
      # as the owner FIREBASE_TOKEN above, and this SA must never be widened to
      # the IAM writes the deploy needs.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Authorize the canonical App Hosting host for Firebase Auth so Google
      # sign-in can never silently break when the host falls out of the
      # project's authorized domains. This is the regression the App Hosting
      # migration shipped: scripts/authorize-domain.mjs was created but never
      # run against production, so /login showed auth/unauthorized-domain.
      # The script is idempotent (GETs the Identity Toolkit config, PATCHes
      # only when the host is missing), so running it on every deploy is a
      # cheap self-heal. Gated on the SA credential (skip-not-fail on forks /
      # unconfigured repos where the secret is empty); on a real main push the
      # emulator-compare needs-edge already fails loudly when the SA is
      # missing, so a canonical deploy can never skip this silently.
      - name: Authorize the canonical host for Firebase Auth
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: npm run authorize:domain

      - name: Fail loudly if FIREBASE_TOKEN is missing (main push)
        if: ${{ github.event_name == 'push' && github.repository == 'LCHEROURI/cook-with-freebuff' && env.FIREBASE_TOKEN == '' }}
        run: |
          echo "::error::FIREBASE_TOKEN secret missing — the App Hosting deploy cannot run."
          echo "Run: npx -y firebase-tools@latest login:ci  then add the token under GitHub -> Settings -> Secrets and variables -> Actions."
          exit 1

      - name: Deploy to Firebase App Hosting
        id: deploy
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          node scripts/write-commit.mjs

          # App Hosting accepts ONE rollout at a time. A deploy landing while
          # the previous commit's rollout is still building is rejected with
          # "HTTP Error: 409, unable to queue the operation", so a burst of
          # quick pushes (docs + fix commits in a row) red-ed the job. Retry
          # that specific transient with a growing backoff so the pushes
          # converge. Only the 409 is retried: a genuine build or rollout
          # failure exits immediately because retrying it cannot help.
          attempt=1
          max_attempts=5
          while true; do
            log="$RUNNER_TEMP/apphosting-deploy.log"
            if npx -y firebase-tools@latest deploy --only apphosting --non-interactive --project portfolio-app-freebuff2 >"$log" 2>&1; then
              cat "$log"
              echo "App Hosting rollout succeeded (attempt $attempt)"
              break
            fi
            cat "$log"
            if grep -qE '409|unable to queue the operation' "$log"; then
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::App Hosting deploy still 409-conflicted after $max_attempts attempts. Another rollout is stuck in flight. Investigate, then re-run the job."
                exit 1
              fi
              wait_s=$((attempt * 30))
              echo "::warning::App Hosting rollout already in flight (409). Retrying in ${wait_s}s (attempt $attempt/$max_attempts)..."
              sleep "$wait_s"
              attempt=$((attempt + 1))
            else
              echo "::error::App Hosting deploy failed with a non-409 error. Not retrying. See the log above."
              exit 1
            fi
          done
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Post-deploy verify:live — the deployed-app gate. Runs in the SAME run as
  # the deploy (needs: [deploy-apphosting]) instead of an event-driven
  # workflow, so it can never race the host build the way the old event
  # driven workflow could. `firebase deploy --only apphosting` can return
  # while the rollout is still queued or building, so the first step polls
  # the host's /api/build-info (tokenless) until it serves the pushed commit
  # (wait-for-deploy-sha) — the gate PROVES the target serves your commit
  # before exercising it. Then the post-deploy smoke and verify:live run
  # against that same host. deploy-apphosting only runs on real main pushes +
  # workflow_dispatch, so this job is skipped on PRs and merge-queue pushes.
  verify-live:
    name: Verify deployed app after deploy (verify:live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [deploy-apphosting]
    # Serialize the live-voice probe with the weekly mic-regression monitor:
    # both drive the SAME owner (APP_OWNER_UID) through the same /cook active
    # session, so overlapping runs would attach to each other's probe and
    # cross-exercise shared state (Codex P2, PR #98 review). One shared group
    # makes them queue instead of collide.
    concurrency:
      group: live-voice-probe
      cancel-in-progress: false
    # Skip when no rollout actually ran (fork / secretless dispatch): the
    # deploy job succeeds with its deploy step skipped, and polling the
    # canonical host for a sha that never arrives would fail after 15 minutes.
    # A skipped or failed deploy skips this job anyway (needs edge); this
    # handles the ran-but-no-rollout case.
    if: ${{ needs.deploy-apphosting.outputs.deployed == 'true' }}

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Loud guard: on a real main deploy of the canonical repo, a missing
      # secret fails the run instead of silently skipping the verify steps
      # below — a skipped gate would masquerade as a green post-deploy check.
      # Manual workflow_dispatch re-runs stay exempt (operator-initiated,
      # skipped steps are visible to the operator).
      - name: Fail loudly if a verify secret is missing (main deploy)
        if: ${{ github.event_name != 'workflow_dispatch' && github.repository == 'LCHEROURI/cook-with-freebuff' && (env.NEXT_PUBLIC_FIREBASE_API_KEY == '' || env.FIREBASE_SERVICE_ACCOUNT == '' || env.APP_OWNER_UID == '' || env.GOOGLE_AI_API_KEY == '' || env.NEXT_PUBLIC_FIREBASE_APP_ID == '') }}
        run: |
          echo "::error::Required GitHub Actions secret(s) missing on main deploy:"
          [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ] && echo "  - NEXT_PUBLIC_FIREBASE_API_KEY (mints the owner ID token for verify:live)"
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && echo "  - FIREBASE_SERVICE_ACCOUNT (seeds the owner recipe + mints the owner custom token)"
          [ -z "$APP_OWNER_UID" ] && echo "  - APP_OWNER_UID (the owner Firebase Auth uid verify:live signs in as)"
          [ -z "$GOOGLE_AI_API_KEY" ] && echo "  - GOOGLE_AI_API_KEY (the Gemini provider the agent turn must answer with)"
          [ -z "$NEXT_PUBLIC_FIREBASE_APP_ID" ] && echo "  - NEXT_PUBLIC_FIREBASE_APP_ID (mints the App Check token for verify:live)"
          echo "Add them under GitHub -> Settings -> Secrets and variables -> Actions, then re-run this job."
          exit 1
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # The deploy job can exit while the rollout is still building. Prove the
      # host serves the pushed commit (github.sha — what write-commit.mjs
      # stamped) before doing anything else; a timeout names the failing hop.
      # Tokenless: /api/build-info is public.
      - name: Wait for the App Hosting rollout to serve the pushed commit
        run: node scripts/wait-for-deploy-sha.mjs --url "https://cook-with-freebuff--portfolio-app-freebuff2.us-central1.hosted.app" --expect "${{ github.sha }}"

      # Post-deploy smoke: the pre-deploy emulator-compare smoke gates the
      # DEPLOY (above); this is the same fail-fast pattern on the post-deploy
      # side, and it needs NOTHING NEW — plain curl, the canonical URL already
      # wired above, no secrets, no setup. verify:live is a ~20-30 min run, so
      # before committing to it this step proves the two cheapest facts about
      # the fresh deploy: the canonical URL answers 200 and /api/build-info
      # serves a real commitSha. A broken hop fails here in seconds with the
      # hop named, instead of surfacing half an hour later inside verify:live.
      # Gated on the same five required inputs as verify:live, so a fork that skips
      # the deep run also skips its pre-flight.
      - name: Post-deploy smoke (app up + build-info answers)
        if: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.APP_OWNER_UID != '' && env.GOOGLE_AI_API_KEY != '' && env.NEXT_PUBLIC_FIREBASE_APP_ID != '' }}
        run: |
          set -euo pipefail
          base="https://cook-with-freebuff--portfolio-app-freebuff2.us-central1.hosted.app"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$base")" || {
            echo "::error::post-deploy smoke: canonical URL did not answer (curl exit $?) — the fresh deploy is not reachable"
            exit 1
          }
          if [ "$code" != "200" ]; then
            echo "::error::post-deploy smoke: canonical URL answered HTTP $code (expected 200) — the fresh deploy is not reachable"
            exit 1
          fi
          body="$(curl -sS --max-time 15 "$base/api/build-info")" || {
            echo "::error::post-deploy smoke: /api/build-info did not answer (curl exit $?) — the API hop is broken"
            exit 1
          }
          sha="$(printf '%s' "$body" | sed -n 's/.*"commitSha":"\([^"]*\)".*/\1/p')"
          if [ -z "$sha" ]; then
            echo "::error::post-deploy smoke: /api/build-info answered but reported no commitSha (raw: ${body:0:120})"
            exit 1
          fi
          echo "post-deploy smoke: canonical 200, /api/build-info commit ${sha:0:12} — verify:live preconditions met"

      # Chrome: verify:live's [3d] stage drives the real /cook UI via
      # scripts/drive-starter-prefs.mjs (headless CDP), so the runner needs a
      # Chromium binary — same browser-actions/setup-chrome pattern as before.
      # CHROME_PATH is threaded into the step so the driver's spawn finds the
      # Linux binary (its Mac path fallback would crash here).
      - name: Install Chrome for the UI starter driver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      # End-to-end verification of the freshly deployed app, against the
      # canonical App Hosting URL. Gated on the full credential set so forks /
      # unconfigured repos stay green, and the Gemini turn is always enforced
      # here (locally it SKIPs when the key is absent). The wait-for-sha step
      # above is what guarantees "new build": the host provably serves the
      # pushed commit before this runs.
      - name: Verify deployed app end to end (verify:live)
        id: verify
        if: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.APP_OWNER_UID != '' && env.GOOGLE_AI_API_KEY != '' && env.NEXT_PUBLIC_FIREBASE_APP_ID != '' }}
        run: npm run verify:live -- --require-app-check-enforced
        env:
          VERIFY_BASE_URL: https://cook-with-freebuff--portfolio-app-freebuff2.us-central1.hosted.app
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Drill seam — fail('SIMULATED regression …') injected right after
          # the guard, so a spared + this seam → 2 failures → reason=undefined.
          FORCE_VERIFY_LIVE_REGRESSION: ${{ inputs.force_verify_live_regression == 'true' && 'true' || '' }}

      # Record the verify:live verdict to Firestore for the public /status
      # page. Runs ALWAYS so a red run is recorded too — a failure must stay
      # visible at a glance, not vanish. Gated on the verify step's outcome so
      # it only records when verify:live actually RAN (a skipped pre-flight
      # never overwrites the last real result), and it reads
      # FIREBASE_SERVICE_ACCOUNT from the job env — no new secret wiring.
      #
      # The verdict comes from VERIFY_LIVE_VERDICT (set by verify:live itself
      # via GITHUB_ENV) so the distinct 'external' state — the Gemini credits
      # block — is preserved instead of collapsing into the step's exit status
      # ('success' on a zero exit); the step outcome is only the fallback for
      # paths where verify:live never got far enough to write it.
      - name: Record verify:live result for the status page
        if: ${{ always() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
        run: node scripts/record-verify-status.mjs --verdict "${VERIFY_LIVE_VERDICT:-${{ steps.verify.outcome }}}" --commit "${{ github.sha }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --reason "${VERIFY_LIVE_REASON:-}" --source "${{ inputs.source || 'ci' }}"
