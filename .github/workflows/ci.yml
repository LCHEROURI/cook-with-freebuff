name: CI

on:
  push:
    # The merge queue pushes its temporary branches (gh-readonly-queue/**) to
    # run the required checks against the MERGED state — the workflows must
    # trigger there or the queue waits forever on checks that never report.
    branches: [main, 'gh-readonly-queue/**']
  pull_request:
    branches: [main]
  # Manual re-run of the post-deploy verification without a new push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      # Push-time stale-head guard: verifies the pushed HEAD is not a rollback
      # of what Vercel is currently serving, BEFORE the deploy starts (the
      # post-deploy workflow can only prove what was deployed == what was
      # pushed; it cannot catch a stale push that should never have deployed).
      # Runs verify-deployed-hash with --stale-guard, which is DIRECTION-aware:
      # a normal forward push (live behind the pushed HEAD — the standard case
      # right before a deploy) PASSES here and is proven after deploy; only a
      # push whose HEAD is NOT ahead of live (rollback/diverged) fails. Only
      # runs on pushes to main — a PR head is legitimately behind live main, so
      # the check would falsely block every PR. Gated on VERCEL_TOKEN; the
      # loud guard below turns a missing token into a failure instead of a
      # silently skipped gate.
      - name: Fail loudly if VERCEL_TOKEN is missing (main push)
        if: ${{ github.event_name == 'push' && github.repository == 'LCHEROURI/cook-with-freebuff' && env.VERCEL_TOKEN == '' }}
        run: |
          echo "::error::VERCEL_TOKEN secret missing — the stale-head guard cannot run on a main push."
          echo "Add it under GitHub -> Settings -> Secrets and variables -> Actions, then re-run."
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify pushed head is not stale vs live (stale-guard)
        if: ${{ github.event_name == 'push' && env.VERCEL_TOKEN != '' }}
        run: node scripts/verify-deployed-hash-gate.mjs --stale-guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # PR-time stale-head guard: the SAME direction-aware gate, pinned to the
      # PR head via --head instead of the pushed HEAD. This is load-bearing on
      # PRs because the checkout is the MERGE ref — which always contains
      # current base main — so comparing live against the checkout HEAD would
      # make every stale PR pass. The rule, applied to the PR head: FAIL iff
      # live is NOT an ancestor of the PR head (the PR was cut before live's
      # current state — stale, update the branch); PASS if the PR head already
      # contains the entire live state (cut from current-or-newer main). A PR
      # head is legitimately behind BASE main (that is why this step never
      # runs on push — the push-time step above is the push contract), but a
      # PR cut before LIVE's state is exactly what this check surfaces in the
      # PR checks instead of only at merge time. Gated on VERCEL_TOKEN: fork
      # PRs have no secrets → skip-not-fail, and the loud guard below fails a
      # missing token on the canonical repo instead of a silently green skip.
      - name: Fail loudly if VERCEL_TOKEN is missing (PR)
        if: ${{ github.event_name == 'pull_request' && github.repository == 'LCHEROURI/cook-with-freebuff' && env.VERCEL_TOKEN == '' }}
        run: |
          echo "::error::VERCEL_TOKEN secret missing — the PR stale-head guard cannot run."
          echo "Add it under GitHub -> Settings -> Secrets and variables -> Actions, then re-run."
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify PR head is not stale vs live (stale-guard)
        if: ${{ github.event_name == 'pull_request' && env.VERCEL_TOKEN != '' }}
        run: node scripts/verify-deployed-hash-gate.mjs --stale-guard --head "${{ github.event.pull_request.head.sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # Firebase App Hosting sync: deploy the Firebase Hosting side after every
  # push to main, so it stops drifting behind Vercel (which auto-deploys on
  # push while App Hosting had to be deployed manually via `npm run
  # deploy:apphosting`). Runs AFTER validate passes (never deploy broken code).
  # Auth is a FIREBASE_TOKEN refresh token from `firebase login:ci` run as the
  # project OWNER: `firebase deploy --only apphosting` is the "deploy from
  # source as a human" path and provisions resources (creates a service
  # account, sets the project IAM policy for the App Hosting agents) that
  # require owner-level IAM — the restricted Admin SDK service account the
  # verify gates use does NOT have it, and must never be widened to setIamPolicy.
  # write-commit.mjs stamps the CI HEAD into commit-sha.txt first (the source
  # ZIP excludes .git), so /api/build-info reports the exact pushed commit.
  # Gated on FIREBASE_TOKEN (skip-not-fail on forks/unconfigured repos); the
  # loud guard below turns a missing token on a canonical main push into a
  # failure. Pull requests never deploy.

  # Emulator-compare smoke: prove the deterministic guided flow works on the
  # local Firestore/Auth emulator stack AND matches what production serves,
  # BEFORE any deploy proceeds. Runs on every main push (and manual
  # dispatch); deploy-apphosting waits on it. ALSO runs on pull_request so it
  # can be a GitHub required status check (a required check that never runs
  # on PRs blocks merges forever) — on a PR the deployed leg still compares
  # against the CURRENT live deploy (context-independent: it proves the
  # emulator stack reproduces what's live, not the PR's code). The deployed
  # leg uses the same owner-credential secrets verify-deployed.yml uses; the
  # emulator leg is offline and needs Java 21 (Firestore emulator). A
  # divergence — a guided step that passes on one stack and not the other —
  # fails the job.
  emulator-compare:
    name: Emulator-compare smoke (guided flow vs live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator requires Java 21 (see README); ubuntu runners
      # default to an older JDK, so pin it explicitly.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Fail loudly if owner credentials are missing
        if: ${{ github.repository == 'LCHEROURI/cook-with-freebuff' && (env.NEXT_PUBLIC_FIREBASE_API_KEY == '' || env.FIREBASE_SERVICE_ACCOUNT == '' || env.APP_OWNER_UID == '') }}
        run: |
          echo "::error::Owner-credential secrets missing — the emulator-compare smoke cannot run its deployed leg."
          echo "Add NEXT_PUBLIC_FIREBASE_API_KEY, FIREBASE_SERVICE_ACCOUNT and APP_OWNER_UID under GitHub -> Settings -> Secrets and variables -> Actions, then re-run."
          exit 1

      # Gated on the credentials like verify-deployed.yml's verify step, so
      # fork PRs (no secrets) skip-not-fail and stay mergeable; on the
      # canonical repo a missing credential is caught by the loud guard above
      # instead (a skipped run must never masquerade as a green smoke).
      - name: Run the emulator-compare smoke
        if: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.APP_OWNER_UID != '' }}
        run: npm run verify:live:compare:emulator

  deploy-apphosting:
    name: Deploy Firebase App Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, emulator-compare]
    # Real main pushes only — the merge queue ALSO pushes (gh-readonly-queue
    # branches), and deploying those merge commits to App Hosting would ship
    # unmerged work. workflow_dispatch stays operator-initiated.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail loudly if FIREBASE_TOKEN is missing (main push)
        if: ${{ github.event_name == 'push' && github.repository == 'LCHEROURI/cook-with-freebuff' && env.FIREBASE_TOKEN == '' }}
        run: |
          echo "::error::FIREBASE_TOKEN secret missing — the App Hosting deploy cannot run."
          echo "Run: npx -y firebase-tools@latest login:ci  then add the token under GitHub -> Settings -> Secrets and variables -> Actions."
          exit 1

      - name: Deploy to Firebase App Hosting
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          node scripts/write-commit.mjs

          # App Hosting accepts ONE rollout at a time. A deploy landing while
          # the previous commit's rollout is still building is rejected with
          # "HTTP Error: 409, unable to queue the operation", so a burst of
          # quick pushes (docs + fix commits in a row) red-ed the job. Retry
          # that specific transient with a growing backoff so the pushes
          # converge. Only the 409 is retried: a genuine build or rollout
          # failure exits immediately because retrying it cannot help.
          attempt=1
          max_attempts=5
          while true; do
            log="$RUNNER_TEMP/apphosting-deploy.log"
            if npx -y firebase-tools@latest deploy --only apphosting --non-interactive --project portfolio-app-freebuff2 >"$log" 2>&1; then
              cat "$log"
              echo "App Hosting rollout succeeded (attempt $attempt)"
              break
            fi
            cat "$log"
            if grep -qE '409|unable to queue the operation' "$log"; then
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::App Hosting deploy still 409-conflicted after $max_attempts attempts. Another rollout is stuck in flight. Investigate, then re-run the job."
                exit 1
              fi
              wait_s=$((attempt * 30))
              echo "::warning::App Hosting rollout already in flight (409). Retrying in ${wait_s}s (attempt $attempt/$max_attempts)..."
              sleep "$wait_s"
              attempt=$((attempt + 1))
            else
              echo "::error::App Hosting deploy failed with a non-409 error. Not retrying. See the log above."
              exit 1
            fi
          done
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # NOTE: the post-deploy verify:live gate NO LONGER lives here. It used to run
  # in this push-triggered job, where it RACED the Vercel build — hitting the
  # previous deployment or a 502 mid-deploy. It now runs from
  # .github/workflows/verify-deployed.yml, triggered by Vercel's
  # deployment_status event AFTER a successful production deploy, targeting the
  # deployment's own URL. Validate above is the push-time contract; the live
  # contract is the post-deploy workflow.
