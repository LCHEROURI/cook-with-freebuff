name: Codex review gate

# Fails a PR when the Codex review bot leaves an OPEN P0/P1 finding, instead
# of relying on the post-merge issue monitor to catch it after the fact. The
# bot posts inline review comments shortly after a PR opens — often AFTER the
# initial checks complete — so the gate re-runs on review-comment (created
# and deleted) and review events as well as the standard pull_request events:
# a P1 that lands after the first check run still reddens this required check
# and blocks the merge.
#
# A finding is open until a human reply lands on its thread (in_reply_to_id) —
# the resolution-note convention — so fixing the code and replying on the
# thread turns the gate green. P2 findings never block by default; the
# stricter bar (also blocking P2) is the CODEX_GATE_INCLUDE_P2 repo variable
# (variable-only by design: a workflow_dispatch input cannot strengthen the
# required merge gate, since dispatch checks never enter the PR status
# rollup). Same required check, stronger gate (see
# scripts/codex-review-pr-gate.mjs --include-p2). The gate also waits for a
# real Codex review of the current head before passing — an empty comment
# list is not a clean review (see the script header).
#
# Add "Codex P1 gate" to the branch's required status checks for the gate to
# actually block merges (this workflow only reports the check result).
#
# Credit policy: the script exits before Codex polling for documentation,
# repository-policy, and tests-only changes. Application, auth, data,
# dependency, Firebase, workflow, and infrastructure changes retain the
# P0/P1 review gate. Nudges are disabled by default; no PAT is provided.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The bot's inline comments and reviews arrive after the initial checks —
  # re-run the gate the moment one lands so the required check reflects it.
  # `deleted` matters too: a resolution reply that gets deleted re-opens its
  # finding, and the check must recompute rather than keep the stale green
  # (Codex P2, PR #73 review).
  pull_request_review_comment:
    types: [created, deleted]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to gate
        required: true
      allow_no_review:
        description: Certify when the bot has not reviewed this PR (human-confirmed skip)
        required: false
        default: 'false'
        type: boolean


concurrency:
  group: codex-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  codex-gate:
    name: Codex P1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Read is enough for checkout. The workflow intentionally does not have
      # permission to push nudge commits; that credit-consuming path is
      # disabled in Actions.
      contents: read
      pull-requests: write
      # actions: write so a green gate can re-run its own check after a
      # cancelled run left the merge evaluation stale (Codex, PR #113) — the
      # self-heal posts a fresh check run, which re-evaluates the merge.
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # gh is preinstalled on ubuntu runners but needs GH_TOKEN set explicitly
      # inside Actions. Low-risk PRs exit before reading Codex review data.
      - name: Run risk-based Codex P1 gate
        env:
          GH_TOKEN: ${{ github.token }}
          # Nudges are intentionally disabled. This prevents empty commits,
          # repeated workflows, and unnecessary Codex credit consumption.
          CODEX_GATE_NUDGE_MAX: '0'
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
          CODEX_GATE_ALLOW_NO_REVIEW: ${{ github.event.inputs.allow_no_review == 'true' }}
          # Bot-skipped-PR certification: a repo variable (comma-separated PR
          # numbers) rides this pull_request-triggered run, so the certified
          # pass satisfies the required merge gate (a workflow_dispatch check
          # never enters the PR status rollup).
          CODEX_GATE_BOT_SKIPPED_PRS: ${{ vars.CODEX_GATE_BOT_SKIPPED_PRS }}
          # Stricter bar: the repo variable CODEX_GATE_INCLUDE_P2=true also
          # blocks on open P2 findings, via the same required check. This is
          # deliberately variable-only — a workflow_dispatch input cannot
          # strengthen the merge gate, because dispatch checks never enter
          # the PR status rollup (Codex P2, PR #78 review).
          CODEX_GATE_INCLUDE_P2: ${{ vars.CODEX_GATE_INCLUDE_P2 == 'true' }}
        # A direct push to main has no pull-request thread, so there is
        # nothing to gate — report the required check as passing so admins-
        # enforcement does not deadlock direct pushes, while the PR triggers
        # above still genuinely gate pull_request merges.
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "push to main without a PR context — nothing to gate; reporting pass"
            exit 0
          fi
          node scripts/codex-review-pr-gate.mjs
