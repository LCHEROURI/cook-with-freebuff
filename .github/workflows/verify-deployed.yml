name: Verify deployed (post-deploy)

# Vercel's GitHub integration posts a deployment_status event when it finishes
# building each deployment. The push-triggered verify:live gate used to live in
# ci.yml, where it RACED the Vercel build — it often hit the previous build (or
# a 502 mid-deploy), so its verdict was about the old commit, not the one just
# pushed. This workflow closes that gap: it runs verify:live ONLY after Vercel
# reports a successful PRODUCTION deploy, targeting the deployment's own URL
# (target_url), so the check exercises the exact build the event describes.
#
# Event-shape notes:
#   - `secrets` is not a valid context in job-level `if`, so secret presence is
#     checked on a step via job env (same pattern as ci.yml).
#   - The write-heavy verify:live gate stays Production-only (previews share
#     the same Firestore backend and would consume the owner-verify write
#     budget for no gate value). Preview deployments get their OWN lightweight
#     hash-gate job below (VERCEL_TOKEN only, zero Firestore reads/writes): it
#     proves the PR preview serves the PR head commit, so branch protection can
#     require a real post-deploy check on every PR.
#   - The verify step targets the CANONICAL production URL, not the
#     deployment-specific target_url: Vercel's Deployment Protection 401s the
#     deployment subdomain ("Protected deployment") and the canonical alias is
#     public. The event still guarantees the deploy COMPLETED before this job
#     runs, and the runner's checkout + npm ci (~30-60s) cover the alias
#     promotion window, so verify:live exercises the new build, never the old
#     one. The target_url is echoed for transparency.
#   - workflow_dispatch re-runs verify the same canonical URL (no
#     deployment_status context exists for them) — identical credential set.
#   - Exact-deployment hash gate: the workflow ALSO resolves the deployment
#     the event describes (--url target_url) and asserts its commit sha
#     matches the pushed head (--expect deployment.sha, TOP-level field) and
#     that the canonical alias serves the SAME commit (--compare-url) — so
#     "the canonical URL serves the new commit" is proven, not inferred.
#     Gated on VERCEL_TOKEN (skip-not-fail; loud guard fails a missing token
#     on production deploys).

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: verify-deployed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-deployed-live:
    name: Verify deployed app after deploy (verify:live)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production' &&
       github.event.deployment_status.target_url != '')

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Echo the deployment being verified
        run: |
          echo "event:       ${{ github.event_name }}"
          echo "state:       ${{ github.event.deployment_status.state }}"
          echo "environment: ${{ github.event.deployment_status.environment }}"
          echo "target_url:  ${{ github.event.deployment_status.target_url }}"

      # Loud guard: on a real production deploy of the canonical repo, a
      # missing secret fails the run instead of silently skipping the verify
      # step below — a skipped gate would masquerade as a green post-deploy
      # check. Manual workflow_dispatch re-runs stay exempt (operator-initiated,
      # skipped steps are visible to the operator).
      - name: Fail loudly if a verify secret is missing (production deploy)
        if: ${{ github.event_name != 'workflow_dispatch' && github.repository == 'LCHEROURI/cook-with-freebuff' && (env.NEXT_PUBLIC_FIREBASE_API_KEY == '' || env.FIREBASE_SERVICE_ACCOUNT == '' || env.APP_OWNER_UID == '' || env.GOOGLE_AI_API_KEY == '' || env.VERCEL_TOKEN == '') }}
        run: |
          echo "::error::Required GitHub Actions secret(s) missing on production deploy:"
          [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ] && echo "  - NEXT_PUBLIC_FIREBASE_API_KEY (mints the owner ID token for verify:live)"
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && echo "  - FIREBASE_SERVICE_ACCOUNT (seeds the owner recipe + mints the owner custom token)"
          [ -z "$APP_OWNER_UID" ] && echo "  - APP_OWNER_UID (the owner Firebase Auth uid verify:live signs in as)"
          [ -z "$GOOGLE_AI_API_KEY" ] && echo "  - GOOGLE_AI_API_KEY (the Gemini provider the agent turn must answer with)"
          [ -z "$VERCEL_TOKEN" ] && echo "  - VERCEL_TOKEN (resolves the deployment commit for the exact-deployment hash gate)"
          echo "Add them under GitHub -> Settings -> Secrets and variables -> Actions, then re-run this job."
          exit 1
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Exact-deployment hash assertion: resolve the deployment Vercel just
      # deployed (the event's target_url) and assert its recorded commit sha
      # matches the commit the push recorded (github.event.deployment.sha — at
      # the TOP level, not under deployment_status). This closes the
      # infer-vs-verify gap: verify:live proves the app WORKS; this proves the
      # build Vercel is serving is the build the push recorded. Gated on the
      # VERCEL_TOKEN secret (skip-not-fail for forks/unconfigured repos; the
      # loud guard above turns a missing token into a hard failure on
      # production deploys). workflow_dispatch has no deployment_status event
      # context, so the hash steps only run on real deploy events.
      - name: Verify deployed commit matches the pushed head
        if: ${{ env.VERCEL_TOKEN != '' && github.event_name != 'workflow_dispatch' }}
        run: |
          node scripts/verify-deployed-hash.mjs \
            --url "${{ github.event.deployment_status.target_url }}" \
            --expect "${{ github.event.deployment.sha }}"  # 
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Alias-routing drift watch: for the same deployment, assert the
      # canonical production alias (cook-with-freebuff.vercel.app) serves the
      # SAME commit as the deployment-specific target_url just verified above
      # — so "the canonical URL serves the commit the event describes" is
      # proven directly, not inferred.
      - name: Alias-routing drift watch (production)
        if: ${{ env.VERCEL_TOKEN != '' && github.event_name != 'workflow_dispatch' }}
        run: |
          node scripts/verify-deployed-hash.mjs \
            --url "${{ github.event.deployment_status.target_url }}" \
            --compare-url "https://cook-with-freebuff.vercel.app"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # End-to-end verification of the freshly deployed app. Gated on the full
      # credential set so forks / unconfigured repos stay green, and the Gemini
      # turn is always enforced here (locally it SKIPs when the key is absent).
      # VERIFY_BASE_URL is the canonical production URL (public — the
      # deployment subdomain is Vercel-protected). The event ordering is what
      # guarantees "new build": this job only starts after a successful
      # production deploy, and checkout + npm ci outlast the alias promotion.
      - name: Verify deployed app end to end (verify:live)
        if: ${{ env.NEXT_PUBLIC_FIREBASE_API_KEY != '' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.APP_OWNER_UID != '' && env.GOOGLE_AI_API_KEY != '' }}
        run: npm run verify:live
        env:
          VERIFY_BASE_URL: https://cook-with-freebuff.vercel.app
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_OWNER_UID: ${{ secrets.APP_OWNER_UID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}

  # PR preview gate — the post-deploy check PRs can report. Vercel posts a
  # deployment_status event for EVERY deployment, including the previews it
  # builds for pull-request branches. This job fires on successful PREVIEW
  # deployments and proves the preview serves the PR head commit (the same
  # exact-deployment hash assertion the production job runs, minus the
  # write-heavy verify:live) — so branch protection can require a real
  # post-deploy check on PRs, not just the push-time validate job. It is
  # deliberately lightweight: VERCEL_TOKEN only, zero Firestore traffic.
  #
  # Fork handling: fork PRs have no secrets, so the verify step is
  # skip-not-fail there; the loud guard only fires on the canonical repo.
  verify-preview-deploy:
    name: Verify PR preview deploy (hash gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview' &&
      github.event.deployment_status.target_url != ''

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Echo the preview deployment being verified
        run: |
          echo "state:       ${{ github.event.deployment_status.state }}"
          echo "environment: ${{ github.event.deployment_status.environment }}"
          echo "target_url:  ${{ github.event.deployment_status.target_url }}"
          echo "sha:         ${{ github.event.deployment.sha }}"

      # Exact-deployment assertion for the preview: the deployment Vercel just
      # built (target_url) must record the PR head commit (deployment.sha).
      # Gated on VERCEL_TOKEN (skip-not-fail on forks where secrets are
      # unavailable); the loud guard below turns a missing token on the
      # canonical repo into a failure instead of a silently green skip.
      - name: Verify the preview serves the PR head commit
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          node scripts/verify-deployed-hash.mjs \
            --url "${{ github.event.deployment_status.target_url }}" \
            --expect "${{ github.event.deployment.sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Fail loudly if VERCEL_TOKEN is missing (preview deploy)
        if: ${{ env.VERCEL_TOKEN == '' && github.repository == 'LCHEROURI/cook-with-freebuff' }}
        run: |
          echo "::error::VERCEL_TOKEN secret missing — the PR preview hash gate cannot run."
          echo "Add it under GitHub -> Settings -> Secrets and variables -> Actions, then re-run."
          exit 1
