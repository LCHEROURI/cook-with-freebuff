name: Branch tidy (weekly)

# Weekly maintenance scan: detect stale remote-tracking refs, merged local
# branches, and remote branches whose PR merged (the squash-merge blind spot).
# Runs tidy-branches in READ-ONLY report mode: nothing is ever deleted by this
# workflow. When accumulation exists, the dated report is uploaded as a
# workflow artifact and summarized in the run. No PAT or report PR is needed.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — same slot as the mic monitor
  workflow_dispatch:

concurrency:
  group: branch-tidy-weekly
  cancel-in-progress: false

jobs:
  detect:
    name: Detect branch accumulation and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read-only: writes docs/reviews/<date>-branch-tidy.md in the runner
      # workspace and prints FINDINGS: N. The report is not committed.
      - name: Detect accumulation (report mode)
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          report="docs/reviews/${stamp}-branch-tidy.md"
          node scripts/tidy-branches.mjs --report "$report"
          findings="$(sed -n 's/^FINDINGS: //p' "$report" || true)"
          echo "findings=${findings:-0}" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Summarize branch tidy findings
        if: ${{ steps.detect.outputs.findings != '0' }}
        run: |
          echo "### Weekly branch tidy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Found **${{ steps.detect.outputs.findings }}** branch-tidy item(s)." >> "$GITHUB_STEP_SUMMARY"
          echo "Download the attached report artifact for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload branch tidy report
        if: ${{ steps.detect.outputs.findings != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: branch-tidy-${{ steps.detect.outputs.stamp }}
          path: ${{ steps.detect.outputs.report }}
          if-no-files-found: error
          retention-days: 30
